name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project if a zip is present
        run: |
          if [ -f masbahati-capacitor.zip ]; then
            echo "Found zip, extracting..."
            unzip -o masbahati-capacitor.zip -d extracted
            # move contents up one level (zip contains a top folder)
            INNER=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$INNER" ]; then
              shopt -s dotglob
              cp -r "$INNER"/* .
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masbahati-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
